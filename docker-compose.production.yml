name: sunnyregister-production

services:
  postgres:
    image: postgres:16-bookworm
    container_name: sunnyregister-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sunnyregister}
      POSTGRES_USER: ${POSTGRES_USER:-sunnyregister}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${SUNNY_TIMEZONE:-Asia/Shanghai}
    volumes:
      - sunnyregister-postgres:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - worker
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  sunnyregister:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunnyregister/backend:${SUNNYREGISTER_TAG:-latest}
    container_name: sunnyregister-go
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-worker:
        condition: service_healthy
    environment:
      SUNNY_ENV: production
      SUNNY_SECURE_COOKIES: "true"
      SUNNY_TRUST_PROXY_HEADERS: "true"
      SUNNY_PUBLIC_ORIGIN: https://${SUNNYREGISTER_DOMAIN:?SUNNYREGISTER_DOMAIN is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-sunnyadmin}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DATABASE_URL_FILE: /run/secrets/database_url
      PYTHON_WORKER_URL: http://python-worker:8765
      PYTHON_WORKER_TOKEN_FILE: /run/secrets/python_worker_token
      PYTHON_TASK_TYPES: ${PYTHON_TASK_TYPES:-sunny_register,sunny_login,sunny_refresh_session,sunny_acquire_rt,sunny_rebind}
      TZ: ${TZ:-Asia/Shanghai}
      SUNNY_TIMEZONE: ${SUNNY_TIMEZONE:-Asia/Shanghai}
      SUNNY_HEALTHCHECK_ENABLED: ${SUNNY_HEALTHCHECK_ENABLED:-true}
      SUNNY_HEALTHCHECK_TIME: ${SUNNY_HEALTHCHECK_TIME:-06:00}
      SUNNY_HEALTHCHECK_CONCURRENCY: ${SUNNY_HEALTHCHECK_CONCURRENCY:-2}
      SUNNY_HEALTHCHECK_BATCH_SIZE: ${SUNNY_HEALTHCHECK_BATCH_SIZE:-50}
      SUNNY_CONTAINERIZED: "true"
    secrets:
      - admin_password
      - python_worker_token
      - database_url
    volumes:
      - sunnyregister-data:/app/data
    networks:
      - edge
      - worker
    ports:
      - "${SUNNYREGISTER_BIND:-127.0.0.1}:${SUNNYREGISTER_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/sunnyregister-go", "--healthcheck"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  python-worker:
    build:
      context: .
      dockerfile: python-worker/Dockerfile
    image: sunnyregister/python-worker:${SUNNYREGISTER_TAG:-latest}
    container_name: sunnyregister-python-worker
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PYTHON_WORKER_TOKEN_FILE: /run/secrets/python_worker_token
      PYTHONUTF8: "1"
      TZ: ${TZ:-Asia/Shanghai}
      SUNNY_TIMEZONE: ${SUNNY_TIMEZONE:-Asia/Shanghai}
      SUNNY_CONTAINERIZED: "true"
      DISPLAY: ${WORKER_DISPLAY:-:99}
      ENABLE_XVFB: ${ENABLE_XVFB:-false}
      ENABLE_NOVNC: ${ENABLE_NOVNC:-false}
      OUTLOOK_IMAP_PROXY: ${OUTLOOK_IMAP_PROXY:-}
      OUTLOOK_IMAP_DIRECT_FIRST: ${OUTLOOK_IMAP_DIRECT_FIRST:-false}
      OPAI_MOMO_PROTOCOL_BASE_URL: ${OPAI_MOMO_PROTOCOL_BASE_URL:-}
      OPAI_MOMO_PROTOCOL_AUTH_MODE: ${OPAI_MOMO_PROTOCOL_AUTH_MODE:-none}
      OPAI_MOMO_PROTOCOL_TOKEN: ${OPAI_MOMO_PROTOCOL_TOKEN:-}
      OPAI_MOMO_PROTOCOL_ACCESS_KEY: ${OPAI_MOMO_PROTOCOL_ACCESS_KEY:-}
      OPAI_MOMO_PROTOCOL_SECRET_KEY: ${OPAI_MOMO_PROTOCOL_SECRET_KEY:-}
      OPAI_MOMO_PROTOCOL_SIGNATURE_HEADER: ${OPAI_MOMO_PROTOCOL_SIGNATURE_HEADER:-X-Signature}
      OPAI_MOMO_PROTOCOL_HEADERS: ${OPAI_MOMO_PROTOCOL_HEADERS:-}
      OPAI_MOMO_PROTOCOL_ROUTES: ${OPAI_MOMO_PROTOCOL_ROUTES:-}
      OPAI_MOMO_PHONE_SOURCE: ${OPAI_MOMO_PHONE_SOURCE:-pool}
      OPAI_MOMO_PHONE_COUNTRY: ${OPAI_MOMO_PHONE_COUNTRY:-84}
      OPAI_MOMO_PHONE_PREFIX: ${OPAI_MOMO_PHONE_PREFIX:-+84}
      OPAI_MOMO_SMS_COUNTRY: ${OPAI_MOMO_SMS_COUNTRY:-84}
      OPAI_MOMO_SMS_SERVICE: ${OPAI_MOMO_SMS_SERVICE:-momo}
      OPAI_MOMO_SMS_API_BASE_URL: ${OPAI_MOMO_SMS_API_BASE_URL:-}
      OPAI_MOMO_SMS_API_KEY: ${OPAI_MOMO_SMS_API_KEY:-}
      OPAI_MOMO_SMS_MAX_PRICE: ${OPAI_MOMO_SMS_MAX_PRICE:-}
      OPAI_MOMO_SMS_POOL: ${OPAI_MOMO_SMS_POOL:-}
      OPAI_MOMO_PROXY_POOL: ${OPAI_MOMO_PROXY_POOL:-}
      XBOVO_ICLOUD_MAX_CONCURRENCY: ${XBOVO_ICLOUD_MAX_CONCURRENCY:-3}
      XBOVO_ICLOUD_POOL_RETRIES: ${XBOVO_ICLOUD_POOL_RETRIES:-4}
      XBOVO_ICLOUD_QUEUE_TIMEOUT: ${XBOVO_ICLOUD_QUEUE_TIMEOUT:-120}
      XBOVO_ICLOUD_LONG_POLL_SECONDS: ${XBOVO_ICLOUD_LONG_POLL_SECONDS:-10}
      NOVNC_PORT: 6080
      XVFB_WHD: ${XVFB_WHD:-1600x900x24}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - python_worker_token
      - database_url
    ports:
      - "${NOVNC_BIND:-127.0.0.1}:${NOVNC_PORT:-6080}:6080"
    volumes:
      - sunnyregister-data:/app/data
    networks:
      - worker
    shm_size: "${WORKER_SHM_SIZE:-1gb}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  admin_password:
    file: ./secrets/admin_password
  python_worker_token:
    file: ./secrets/python_worker_token
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url

volumes:
  sunnyregister-data:
    name: sunnyregister-data
  sunnyregister-postgres:
    name: sunnyregister-postgres

networks:
  edge:
    name: sunnyregister-edge
  worker:
    name: sunnyregister-worker
