name: sunnyregister

services:
  sunnyregister:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunnyregister/backend:${SUNNYREGISTER_TAG:-latest}
    container_name: sunnyregister-go
    init: true
    restart: unless-stopped
    depends_on:
      python-worker:
        condition: service_healthy
    ports:
      - "${SUNNYREGISTER_BIND:-0.0.0.0}:${SUNNYREGISTER_PORT:-8000}:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_PASSWORD_FILE: /app/data/admin_password.txt
      ACCOUNT_MANAGER_DATABASE_URL: /app/data/account_manager.db
      PYTHON_WORKER_URL: http://python-worker:8765
      PYTHON_WORKER_TOKEN: ${PYTHON_WORKER_TOKEN:-}
      PYTHON_TASK_TYPES: ${PYTHON_TASK_TYPES:-sunny_register,sunny_login,sunny_refresh_session}
      TZ: ${TZ:-Asia/Shanghai}
      SUNNY_TIMEZONE: ${TZ:-Asia/Shanghai}
      SUNNY_CONTAINERIZED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sunnyregister-data:/app/data
    healthcheck:
      test: ["CMD", "/app/sunnyregister-go", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  python-worker:
    build:
      context: .
      dockerfile: python-worker/Dockerfile
    image: sunnyregister/python-worker:${SUNNYREGISTER_TAG:-latest}
    container_name: sunnyregister-python-worker
    init: true
    restart: unless-stopped
    environment:
      ACCOUNT_MANAGER_DATABASE_URL: /app/data/account_manager.db
      PYTHON_WORKER_TOKEN: ${PYTHON_WORKER_TOKEN:-}
      PYTHONUTF8: "1"
      TZ: ${TZ:-Asia/Shanghai}
      SUNNY_TIMEZONE: ${TZ:-Asia/Shanghai}
      SUNNY_CONTAINERIZED: "true"
      DISPLAY: ${WORKER_DISPLAY:-:99}
      ENABLE_XVFB: ${ENABLE_XVFB:-true}
      ENABLE_NOVNC: ${ENABLE_NOVNC:-true}
      OUTLOOK_IMAP_PROXY: ${OUTLOOK_IMAP_PROXY:-}
      OUTLOOK_IMAP_DIRECT_FIRST: ${OUTLOOK_IMAP_DIRECT_FIRST:-false}
      NOVNC_PORT: 6080
      XVFB_WHD: ${XVFB_WHD:-1600x900x24}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Local only. Use an SSH tunnel for remote noVNC troubleshooting.
      - "${NOVNC_BIND:-127.0.0.1}:${NOVNC_PORT:-6080}:6080"
    volumes:
      - sunnyregister-data:/app/data
    shm_size: "${WORKER_SHM_SIZE:-1gb}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sunnyregister-data:
    name: sunnyregister-data
