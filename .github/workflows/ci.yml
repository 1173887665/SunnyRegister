name: SunnyRegister CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum

      - name: Validate Go backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate Python Worker syntax
        run: |
          python -m pip install -r python-worker/requirements.txt
          python -m compileall -q python-worker
          PYTHONPATH=python-worker python -m unittest discover -s python-worker/tests -v

      - name: Validate Docker Compose
        run: docker compose --env-file .env.production.example config --quiet
