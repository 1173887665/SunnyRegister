name: SunnyRegister CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test Go backend
        working-directory: backend
        run: go test -count=1 ./...

      - name: Vet Go backend
        working-directory: backend
        run: go vet ./...

  python-worker:
    name: Python Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python-worker/requirements.txt
            python-worker/requirements-test.txt

      - name: Install Python test dependencies
        run: python -m pip install --requirement python-worker/requirements-test.txt

      - name: Validate Python dependencies
        run: python -m pip check

      - name: Validate Python Worker
        run: |
          python -m compileall -q python-worker
          PYTHONPATH=python-worker python -m pytest -q python-worker/tests

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose --env-file .env.production.example config --quiet
